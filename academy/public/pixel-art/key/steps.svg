<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 366" width="688" height="366" role="img" aria-labelledby="title desc">
  <title id="title">Anahtarı üç adımda çizmek</title>
  <desc id="desc">Halka, sap ve dişler adımlarını gösteren üç panelli, büyütülmüş 8×8 pixel anahtar örneği.</desc>
  <defs>
    <pattern id="checker" width="44" height="44" patternUnits="userSpaceOnUse"><rect width="44" height="44" fill="#1c2823"/><path d="M0 0h22v22H0zM22 22h22v22H22z" fill="#26362f"/></pattern>
  </defs>
  <rect width="688" height="366" rx="18" fill="#ffffff"/>
  <text x="28" y="37" fill="#27231e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">8 × 8 anahtar: şekli parçalara ayır</text>
  <text x="28" y="61" fill="#6b6258" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Büyütülmüş örnek · Her kare bir pixel.</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <g transform="translate(24 84)">
      <rect width="200" height="258" rx="12" fill="#fffdf9" stroke="#ded8ce"/><text x="15" y="30" fill="#27231e" font-size="17" font-weight="700">1 · Halka</text><text x="15" y="52" fill="#6b6258" font-size="13">Deliği boş bırak.</text>
      <g transform="translate(12 66)"><rect width="176" height="176" fill="url(#checker)"/><path d="M0 0V176M22 0V176M44 0V176M66 0V176M88 0V176M110 0V176M132 0V176M154 0V176M176 0V176M0 0H176M0 22H176M0 44H176M0 66H176M0 88H176M0 110H176M0 132H176M0 154H176M0 176H176" fill="none" stroke="#486452" stroke-width="1"/><g transform="scale(22)" shape-rendering="crispEdges"><rect x="1" y="2" width="3" height="1" fill="#f2c078"/><rect x="1" y="3" width="1" height="1" fill="#f2c078"/><rect x="3" y="3" width="1" height="1" fill="#f2c078"/><rect x="1" y="4" width="3" height="1" fill="#f2c078"/></g></g>
    </g>
    <g transform="translate(244 84)">
      <rect width="200" height="258" rx="12" fill="#fffdf9" stroke="#ded8ce"/><text x="15" y="30" fill="#27231e" font-size="17" font-weight="700">2 · Sap</text><text x="15" y="52" fill="#6b6258" font-size="13">Tek satır sağa uzat.</text>
      <g transform="translate(12 66)"><rect width="176" height="176" fill="url(#checker)"/><path d="M0 0V176M22 0V176M44 0V176M66 0V176M88 0V176M110 0V176M132 0V176M154 0V176M176 0V176M0 0H176M0 22H176M0 44H176M0 66H176M0 88H176M0 110H176M0 132H176M0 154H176M0 176H176" fill="none" stroke="#486452" stroke-width="1"/><g transform="scale(22)" shape-rendering="crispEdges"><rect x="1" y="2" width="3" height="1" fill="#f2c078"/><rect x="1" y="3" width="1" height="1" fill="#f2c078"/><rect x="3" y="3" width="5" height="1" fill="#f2c078"/><rect x="1" y="4" width="3" height="1" fill="#f2c078"/></g></g>
    </g>
    <g transform="translate(464 84)">
      <rect width="200" height="258" rx="12" fill="#fffdf9" stroke="#ded8ce"/><text x="15" y="30" fill="#27231e" font-size="17" font-weight="700">3 · Dişler</text><text x="15" y="52" fill="#6b6258" font-size="13">Altta iki küçük çıkıntı.</text>
      <g transform="translate(12 66)"><rect width="176" height="176" fill="url(#checker)"/><path d="M0 0V176M22 0V176M44 0V176M66 0V176M88 0V176M110 0V176M132 0V176M154 0V176M176 0V176M0 0H176M0 22H176M0 44H176M0 66H176M0 88H176M0 110H176M0 132H176M0 154H176M0 176H176" fill="none" stroke="#486452" stroke-width="1"/><g transform="scale(22)" shape-rendering="crispEdges"><rect x="1" y="2" width="3" height="1" fill="#f2c078"/><rect x="1" y="3" width="1" height="1" fill="#f2c078"/><rect x="3" y="3" width="5" height="1" fill="#f2c078"/><rect x="1" y="4" width="3" height="1" fill="#f2c078"/><rect x="5" y="4" width="1" height="1" fill="#f2c078"/><rect x="7" y="4" width="1" height="1" fill="#f2c078"/></g></g>
    </g>
  </g>
</svg>
